<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI FAIL 메이커</title>
<meta name="description" content="이미지에 AI 인식 오류 스타일의 박스와 라벨을 추가해 밈을 만드는 AI FAIL 메이커입니다.">
<meta name="theme-color" content="#0b0c0d">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#e9ebed; --stage:#d6dade; --panel:#f6f7f8; --card:#fff;
  --ink:#15181b; --text2:#3b4148; --muted:#7a828a; --line:#dcdfe3;
  --black:#0b0c0d; --accent:#14b8a6; --accent-strong:#0d9488;
  --accent-soft:rgba(20,184,166,.12); --accent-ink:#05201d; --topbar:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;display:flex;flex-direction:column;min-height:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{height:var(--topbar);flex:none;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20;border-bottom:1px solid #23272b}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
.brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 i{font-style:normal;color:var(--accent)}
.creator{font-size:11px;color:#8b939b;white-space:nowrap;flex:none}
.creator a{color:#8b939b;text-decoration:none}
.creator a:hover{color:#fff}
.topbar-actions{display:flex;gap:10px;align-items:center;flex:none}
.langtabs{display:flex;gap:2px;background:rgba(255,255,255,.06);border:1px solid #262b30;border-radius:9999px;padding:3px}
.langtabs button{font-size:12px;font-weight:700;padding:6px 12px;border:0;border-radius:9999px;background:transparent;color:#9aa1a8}
.langtabs button:hover:not(.active){color:#fff;background:transparent}
.langtabs button.active{background:var(--accent);color:var(--accent-ink)}

/* buttons */
button,input{font:inherit}
button{font-size:13px;font-weight:500;padding:8px 14px;border-radius:9999px;border:1px solid var(--line);background:#fff;color:var(--text2);cursor:pointer;transition:.12s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:8px 18px}
.primary:hover:not(:disabled){background:#2dd4bf;border-color:#2dd4bf}
.dark{background:var(--black);border-color:var(--black);color:#fff;font-weight:600}
.dark:hover:not(:disabled){background:#23272b;border-color:#23272b;color:#fff}
.danger{color:#b4372c}
.danger:hover:not(:disabled){border-color:#b4372c;background:rgba(180,55,44,.08);color:#b4372c}
.full{width:100%}

/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:sticky;top:var(--topbar);height:calc(100vh - var(--topbar));background:radial-gradient(ellipse at 50% 40%,#e2e5e8 0%,var(--stage) 70%);padding:32px;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:box-shadow .12s}
.stage.image-empty{cursor:pointer}
.stage.drag-over{box-shadow:inset 0 0 0 3px var(--accent)}
.canvas-wrap{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.empty-upload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-upload-inner{display:flex;flex-direction:column;align-items:center;gap:14px;color:#9ba3ab;font-weight:700;font-size:32px;line-height:1;text-align:center}
.empty-upload-plus{font-size:68px;font-weight:300;line-height:.8}
.empty-upload-sub{font-size:13px;font-weight:500;line-height:1.4}
.stage:not(.image-empty) .empty-upload{display:none}
canvas{display:block;max-width:100%;max-height:calc(100vh - var(--topbar) - 64px);width:auto;height:auto;background:transparent;touch-action:none;box-shadow:0 16px 40px rgba(0,0,0,.12)}
.side{background:var(--panel);border-left:1px solid var(--line);height:calc(100vh - var(--topbar));position:sticky;top:var(--topbar);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}

/* panels */
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.box h2{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:12px}
.row label,.row .row-label{font-size:13px;min-width:64px;color:var(--text2)}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px}
.field input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.val{font-size:12px;color:var(--muted);min-width:36px;text-align:right}
.color-row{display:flex;align-items:center;gap:10px}
.color-row input[type=color]{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.color-chip{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:none}
.mt{margin-top:12px}

/* detection cards */
.cards{display:flex;flex-direction:column;gap:10px}
.cards-empty{font-size:12px;color:var(--muted);margin:0}
.det-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer}
.det-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.det-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.det-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;min-width:0}
.det-title span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det-num{font-size:11px;color:var(--muted)}
.det-meta{font-size:11px;color:var(--muted);margin-top:6px}
.det-actions{display:flex;gap:6px;margin-top:10px}
.det-actions button{flex:1;padding:6px 10px;font-size:12px}
.det-actions button.layer-move{flex:0 0 34px;padding:6px 0}
.det-card[draggable=true]{cursor:grab}
.det-card.dragging{opacity:.45}
.det-card.drop-before{box-shadow:0 -3px 0 var(--accent)}
.det-card.drop-after{box-shadow:0 3px 0 var(--accent)}
.layer-hint{font-size:11px;color:var(--muted);margin:0 0 10px}

/* toggles */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode-grid button{border-radius:10px;font-weight:700}
.mode-grid button.active{background:var(--black);border-color:var(--black);color:#fff}
.toggle-group{display:flex;gap:4px;flex:1}
.toggle-group button{flex:1;border-radius:8px;padding:7px 8px;font-size:12px;font-weight:600}
.toggle-group button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.file-input{display:none}

/* Pickr/Monolith-style color picker: consistent desktop/mobile UI */
body.color-picker-open { overflow: hidden; }
.color-picker-backdrop {
  position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
  padding: 16px; background: rgba(15,18,20,.32); backdrop-filter: blur(2px);
}
.color-picker-backdrop[hidden] { display: none !important; }
.color-picker-sheet {
  width: min(324px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto;
  background: #fff; border: 1px solid rgba(0,0,0,.09); border-radius: 4px; padding: 18px;
  box-shadow: 0 14px 38px rgba(0,0,0,.22); touch-action: manipulation;
}
.color-picker-preview {
  height: 24px; border-radius: 3px; margin-bottom: 12px; border: 1px solid rgba(0,0,0,.08);
  background: #323232;
}
.color-sv-wrap { position: relative; width: 100%; aspect-ratio: 1.36 / 1; margin-bottom: 14px; touch-action: none; }
#colorSV { width: 100%; height: 100%; display: block; border-radius: 4px; cursor: crosshair; touch-action: none; }
.color-picker-knob {
  position: absolute; width: 22px; height: 22px; border: 2px solid #fff; border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.35);
  transform: translate(-50%,-50%); pointer-events: none;
}
.color-hue-wrap { position: relative; height: 14px; margin: 0 0 28px; touch-action: none; }
#colorHue {
  width: 100%; height: 14px; display: block; border-radius: 999px; cursor: pointer; touch-action: none;
  background: linear-gradient(90deg,#f00 0%,#ff0 16.66%,#0f0 33.33%,#0ff 50%,#00f 66.66%,#f0f 83.33%,#f00 100%);
}
.color-hue-knob {
  position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.48),0 1px 3px rgba(0,0,0,.28);
  transform: translate(-50%,-50%); pointer-events: none; background: #f00;
}
.color-recent-wrap { margin: 0 0 14px; }
.color-recent-label { font-size: 11px; color: #8a9199; margin-bottom: 7px; font-weight: 600; }
.color-recent-row { display: flex; gap: 8px; flex-wrap: wrap; }
.color-recent-swatch {
  width: 24px; height: 24px; padding: 0; border-radius: 50%;
  border: 2px solid rgba(0,0,0,.08); cursor: pointer;
}
.color-recent-swatch:hover { border-color: #4b83e6; }
.color-picker-controls { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; }
.color-hex-wrap { display: flex; align-items: center; min-width: 0; }
#colorHex {
  width: 100%; min-width: 0; height: 41px; padding: 8px 10px; border: 0; border-radius: 2px;
  background: #f0f1f2; color: #747980; font: 16px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  text-transform: uppercase;
}
#colorHex:focus { outline: 2px solid rgba(37,99,235,.22); background: #f7f8f9; }
.color-apply-btn {
  height: 41px; padding: 0 12px !important; border-radius: 2px !important; border: 0 !important;
  background: #4b83e6 !important; color: #fff !important; font-size: 14px !important; font-weight: 700 !important;
}
.color-eyedropper-btn {
  width: 100%; min-height: 42px; margin-top: 10px; border-radius: 8px !important;
  border: 1px solid #a9c7ff !important; background: #eef4ff !important; color: #1670df !important;
  display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px !important;
}
.color-eyedropper-btn[hidden] { display: none !important; }
.color-picker-sr {
  position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important;
  overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important;
}
input[type=color] { touch-action: manipulation; }
@media (max-width: 600px) {
  .color-picker-backdrop { align-items: center; padding: 10px; }
  .color-picker-sheet { width: min(344px, calc(100vw - 20px)); padding: 16px; }
  input[type=color] { width: 48px; height: 40px; }
}
@media(max-width:860px){
  :root{--topbar:94px}
  html,body{overflow:hidden}
  .topbar{height:var(--topbar);padding:7px 12px 8px;align-items:stretch;flex-direction:column;gap:5px}
  .brand{justify-content:space-between;align-items:center;gap:8px}
  .brand h1{font-size:16px}
  .creator{font-size:10px}
  .topbar-actions{justify-content:space-between;gap:8px}
  .langtabs{flex:1;min-width:0;justify-content:space-between;overflow:hidden}
  .langtabs button{flex:1;min-width:0;padding:5px 7px;font-size:11px}
  .primary{font-size:12px;padding:6px 12px;min-height:34px}
  main{display:flex;flex-direction:column;height:calc(100dvh - var(--topbar));overflow:hidden}
  .stage{order:1;position:relative;top:auto;width:100%;height:auto;flex:0 0 44%;min-height:190px;max-height:46vh;padding:10px 12px;border-bottom:1px solid #c9cdd1;box-shadow:0 8px 18px rgba(20,24,28,.08)}
  .empty-upload-inner{font-size:24px}
  .empty-upload-plus{font-size:52px}
  canvas{max-height:100%;box-shadow:0 8px 24px rgba(0,0,0,.1)}
  .side{order:2;position:relative;top:auto;width:100%;height:auto;flex:1;min-height:0;overflow-y:auto;border-left:0;padding:12px;gap:12px}
  .box{border-radius:14px;padding:14px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>AI FAIL <i data-i18n="brandSuffix">메이커</i></h1>
    <span class="creator"><span data-i18n="creator">제작:</span> <a href="https://x.com/swoonqx" target="_blank" rel="noopener noreferrer">𝕏 @swoonqx</a></span>
  </div>
  <div class="topbar-actions">
    <div class="langtabs" id="langTabs" role="tablist" aria-label="언어 선택" data-i18n-aria="langLabel">
      <button type="button" class="active" data-lang="ko" role="tab" aria-selected="true">KR</button>
      <button type="button" data-lang="en" role="tab" aria-selected="false">EN</button>
      <button type="button" data-lang="ja" role="tab" aria-selected="false">JP</button>
      <button type="button" data-lang="zh" role="tab" aria-selected="false">CN</button>
    </div>
    <button id="downloadBtn" class="primary" disabled data-i18n="save">이미지 저장</button>
  </div>
</header>

<main>
  <section class="stage image-empty" id="stage" role="button" tabindex="0" data-i18n-aria="addPhoto" aria-label="사진 추가">
    <div class="canvas-wrap">
      <canvas id="canvas" width="1000" height="1000" aria-label="AI FAIL 밈 미리보기" data-i18n-aria="canvasLabel"></canvas>
      <div class="empty-upload" aria-hidden="true">
        <div class="empty-upload-inner">
          <span class="empty-upload-plus">＋</span>
          <span data-i18n="addPhoto">사진 추가</span>
          <span class="empty-upload-sub" data-i18n="dropHint">클릭 · 드래그 · 붙여넣기(Ctrl+V)</span>
        </div>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="box">
      <h2 data-i18n="aspectTitle">이미지 비율</h2>
      <div class="toggle-group" id="aspectGroup">
        <button type="button" class="active" data-aspect="native" data-i18n="aspectNative">기본</button>
        <button type="button" data-aspect="1:1">1:1</button>
        <button type="button" data-aspect="3:4">3:4</button>
        <button type="button" data-aspect="4:3">4:3</button>
      </div>
    </div>

    <div class="box">
      <h2 data-i18n="imageTitle">이미지</h2>
      <input class="file-input" type="file" id="fileInput" accept="image/*">
      <button type="button" class="dark full" id="pickBtn" data-i18n="pickPhoto">사진 선택</button>
      <div class="row mt"><label for="zoom" data-i18n="zoom">확대</label><input type="range" id="zoom" min="1" max="4" step="0.01" value="1" disabled></div>
      <button type="button" id="resetPosBtn" class="mt" disabled data-i18n="resetPos">위치 초기화</button>
    </div>

    <div class="box">
      <h2 data-i18n="boxTools">박스 작업</h2>
      <div class="mode-grid">
        <button type="button" id="selectMode" class="active" data-i18n="modeSelect">선택/이동</button>
        <button type="button" id="drawMode" data-i18n="modeDraw">박스 추가</button>
      </div>
    </div>

    <div class="box" id="selectedBoxPanel" hidden>
      <h2 data-i18n="selectedBox">선택한 박스</h2>
      <div class="field"><label for="labelInput" data-i18n="labelText">라벨 텍스트</label><input id="labelInput" type="text" maxlength="40" placeholder="kitty"></div>
      <div class="row mt"><label for="colorInput" data-i18n="boxColor">박스 컬러</label><div class="color-row"><input type="color" id="colorInput" value="#59B64C"><div id="colorChip" class="color-chip"></div></div></div>
      <div class="row"><label for="lineWidth" data-i18n="lineWidth">선 두께</label><input type="range" id="lineWidth" min="1" max="10" value="4"><span class="val" id="lineWidthVal">4px</span></div>
      <div class="row"><label for="fontSize" data-i18n="fontSize">글자 크기</label><input type="range" id="fontSize" min="14" max="72" value="40"><span class="val" id="fontSizeVal">40px</span></div>
      <div class="row"><span class="row-label" data-i18n="textAlign">글자 정렬</span>
        <div class="toggle-group" id="labelAlign">
          <button type="button" class="active" data-align="left" data-i18n="alignLeft">왼쪽</button>
          <button type="button" data-align="center" data-i18n="alignCenter">가운데</button>
          <button type="button" data-align="right" data-i18n="alignRight">오른쪽</button>
        </div>
      </div>
      <div class="row"><span class="row-label" data-i18n="labelPos">라벨 위치</span>
        <div class="toggle-group" id="labelPos">
          <button type="button" class="active" data-pos="top" data-i18n="posTop">위</button>
          <button type="button" data-pos="inside" data-i18n="posInside">안쪽</button>
        </div>
      </div>
      <button type="button" id="deleteBtn" class="danger full mt" data-i18n="deleteBox">선택 박스 삭제</button>
    </div>

    <div class="box">
      <h2 data-i18n="detections">인식 박스</h2>
      <div id="cards" class="cards"></div>
    </div>
  </aside>
</main>

<div class="color-picker-backdrop" id="colorPickerBackdrop" hidden>
  <section class="color-picker-sheet" id="colorPickerSheet" role="dialog" aria-modal="true" aria-label="색상 선택" data-i18n-aria="colorPickerTitle">
    <div class="color-picker-preview" id="colorPickerPreview" aria-hidden="true"></div>
    <div class="color-sv-wrap" id="colorSVWrap">
      <canvas id="colorSV" width="576" height="424" aria-label="채도와 밝기" data-i18n-aria="colorSVAria"></canvas>
      <span class="color-picker-knob" id="colorSVKnob" aria-hidden="true"></span>
    </div>
    <div class="color-hue-wrap" id="colorHueWrap">
      <div id="colorHue" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="360" aria-valuenow="0" aria-label="색상" data-i18n-aria="colorHueAria"></div>
      <span class="color-hue-knob" id="colorHueKnob" aria-hidden="true"></span>
    </div>
    <div class="color-recent-wrap" id="colorRecentWrap" hidden>
      <div class="color-recent-label" id="colorRecentLabel" data-i18n="colorRecentLabel">최근 사용한 색상</div>
      <div class="color-recent-row" id="colorRecentRow"></div>
    </div>
    <div class="color-picker-controls">
      <div class="color-hex-wrap">
        <input type="text" id="colorHex" inputmode="text" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="HEX 색상" data-i18n-aria="colorHexAria" value="#323232">
      </div>
      <button type="button" class="color-apply-btn" id="colorApply" data-i18n="colorApply">적용</button>
    </div>
    <button type="button" class="color-eyedropper-btn" id="colorEyedropper" hidden>
      <span aria-hidden="true">⌕</span><span id="colorEyedropperLabel" data-i18n="colorEyedropper">스포이드</span>
    </button>
    <span class="color-picker-sr" id="colorPickerHelp" data-i18n="colorHelp">색상 영역을 움직여 색을 선택하고 적용 버튼을 누르세요.</span>
  </section>
</div>
<script>
(() => {
'use strict';

/* ---------- i18n ---------- */
const I18N = {
  ko: {
    title:'AI FAIL 메이커', brandSuffix:'메이커', creator:'제작:', langLabel:'언어 선택', save:'이미지 저장',
    addPhoto:'사진 추가', dropHint:'클릭 · 드래그 · 붙여넣기(Ctrl+V)', canvasLabel:'AI FAIL 밈 미리보기',
    aspectTitle:'이미지 비율', aspectNative:'기본', imageTitle:'이미지', pickPhoto:'사진 선택', zoom:'확대', resetPos:'위치 초기화',
    boxTools:'박스 작업', modeSelect:'선택/이동', modeDraw:'박스 추가', selectedBox:'선택한 박스',
    labelText:'라벨 텍스트', boxColor:'박스 컬러', lineWidth:'선 두께', fontSize:'글자 크기',
    textAlign:'글자 정렬', alignLeft:'왼쪽', alignCenter:'가운데', alignRight:'오른쪽',

function endPointer() {

canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- side panel controls ---------- */
const withSelected = fn => () => { if (selected >= 0) fn(boxes[selected]); };
labelInput.addEventListener('input', withSelected(b => { b.label = labelInput.value; render(); renderCards(); }));
colorInput.addEventListener('input', withSelected(b => { b.color = colorInput.value; colorChip.style.background = b.color; render(); renderCards(); }));
lineWidth.addEventListener('input', withSelected(b => { b.lineWidth = +lineWidth.value; lineWidthVal.textContent = b.lineWidth + 'px'; render(); }));
fontSize.addEventListener('input', withSelected(b => { b.fontSize = +fontSize.value; fontSizeVal.textContent = b.fontSize + 'px'; render(); }));
labelPos.addEventListener('click', e => { const btn = e.target.closest('button'); if (!btn || selected < 0) return; boxes[selected].labelPos = btn.dataset.pos; updateSelection(); });
labelAlign.addEventListener('click', e => { const btn = e.target.closest('button'); if (!btn || selected < 0) return; boxes[selected].labelAlign = btn.dataset.align; updateSelection(); });
aspectGroup.addEventListener('click', e => { const btn = e.target.closest('button'); if (btn) setCanvasAspect(btn.dataset.aspect); });
selectMode.addEventListener('click', () => setMode('select'));
drawMode.addEventListener('click', () => setMode('draw'));
deleteBtn.addEventListener('click', () => removeBox(selected));
zoom.addEventListener('input', applyZoom);
resetPosBtn.addEventListener('click', resetImagePosition);
$('langTabs').addEventListener('click', e => { const btn = e.target.closest('button'); if (btn) setLang(btn.dataset.lang); });

downloadBtn.addEventListener('click', () => {
  if (!img) return;
  render(false); // export without selection handles
  canvas.toBlob(blob => {
    render();

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = 'ai-fail-meme.png'; a.href = url; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
});

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  if (document.body.classList.contains('color-picker-open')) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'Escape') {
    if (drawing) { drawing = null; render(); }
    else if (mode === 'draw') setMode('select');
    else if (selected >= 0) { selected = -1; updateSelection(); }
    return;
  }
  if (selected < 0) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeBox(selected); return; }
  if (e.key === ']') { moveBox(selected, selected + 1); return; }
  if (e.key === '[') { moveBox(selected, selected - 1); return; }
  const step = e.shiftKey ? 10 : 1;
  const move = { ArrowLeft:[-step, 0], ArrowRight:[step, 0], ArrowUp:[0, -step], ArrowDown:[0, step] }[e.key];

});

/* ---------- color picker (shared look with sw-polaroid) ---------- */
  const COLOR_INPUT_IDS = ['colorInput'];
  const colorUI = {
    backdrop: $('colorPickerBackdrop'), sheet: $('colorPickerSheet'),
    sv: $('colorSV'), svWrap: $('colorSVWrap'), svKnob: $('colorSVKnob'),
    hue: $('colorHue'), hueWrap: $('colorHueWrap'), hueKnob: $('colorHueKnob'),
    preview: $('colorPickerPreview'), hex: $('colorHex'), apply: $('colorApply'),
    eyedropper: $('colorEyedropper'), eyedropperLabel: $('colorEyedropperLabel'),
    recentWrap: $('colorRecentWrap'), recentLabel: $('colorRecentLabel'), recentRow: $('colorRecentRow')
  };
  let activeColorInput = null;
  let colorOriginal = '#000000';
  let colorHSV = { h: 0, s: 0, v: 0.2 };

  // ---- recently used colors (persisted so they're available next time the picker opens) ----
  const RECENT_COLORS_KEY = 'aiFailMakerRecentColors';
  const RECENT_COLORS_MAX = 12;
  let recentColors = [];
  function loadRecentColors() {
    try {
      const raw = localStorage.getItem(RECENT_COLORS_KEY);
      if (raw) recentColors = JSON.parse(raw).filter((h) => hexToRgb(h));
    } catch (_) {}
  }
  function saveRecentColors() {
    try { localStorage.setItem(RECENT_COLORS_KEY, JSON.stringify(recentColors)); } catch (_) {}
  }
  function addRecentColor(hex) {
    hex = hex.toLowerCase();
    recentColors = [hex, ...recentColors.filter((c) => c !== hex)].slice(0, RECENT_COLORS_MAX);
    saveRecentColors();
    buildRecentColorRow();
  }
  function buildRecentColorRow() {
    const wrap = colorUI.recentWrap, row = colorUI.recentRow;
    if (!recentColors.length) { wrap.hidden = true; return; }
    wrap.hidden = false;
    row.innerHTML = '';
    recentColors.forEach((hex) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'color-recent-swatch';
      b.style.background = hex;
      b.title = hex;
      b.addEventListener('click', () => {
        const rgb = hexToRgb(hex);
        if (!rgb) return;
        colorHSV = rgbToHsv(rgb.r, rgb.g, rgb.b);
        refreshColorPicker(true);
      });
      row.appendChild(b);
    });
  }
  let svDragging = false;
  let hueDragging = false;

  function hexToRgb(hex) {
    const clean = String(hex).replace('#', '').trim();
    const full = clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean;
    if (!/^[0-9a-fA-F]{6}$/.test(full)) return null;
    const n = parseInt(full, 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map((n) => Math.round(clamp(n, 0, 255)).toString(16).padStart(2, '0')).join('');

  function rgbToHsv(r, g, b) {

    else if (h < 180) [r,g,b] = [0,c,x];
    else if (h < 240) [r,g,b] = [0,x,c];
    else if (h < 300) [r,g,b] = [x,0,c];

  function hsvToHex(h, s, v) {

  function drawSV() {
    const c = colorUI.sv, g = c.getContext('2d');

    const white = g.createLinearGradient(0, 0, c.width, 0);
    white.addColorStop(0, '#fff'); white.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = white; g.fillRect(0, 0, c.width, c.height);
    const black = g.createLinearGradient(0, 0, 0, c.height);
    black.addColorStop(0, 'rgba(0,0,0,0)'); black.addColorStop(1, '#000');
    g.fillStyle = black; g.fillRect(0, 0, c.width, c.height);

  function pushColorToInput(hex) {

    activeColorInput.dispatchEvent(new Event('input', { bubbles: true }));
  }
  function refreshColorPicker(push = true) {
    const hex = hsvToHex(colorHSV.h, colorHSV.s, colorHSV.v);

    colorUI.hex.value = hex.toUpperCase();
    drawSV();
    colorUI.svKnob.style.left = (colorHSV.s * 100) + '%';
    colorUI.svKnob.style.top = ((1 - colorHSV.v) * 100) + '%';
    colorUI.hueKnob.style.left = (colorHSV.h / 360 * 100) + '%';

  });

  colorUI.sv.addEventListener('pointerup', () => { svDragging = false; });
  colorUI.sv.addEventListener('pointercancel', () => { svDragging = false; });
  colorUI.hue.addEventListener('pointerdown', (e) => {
    hueDragging = true; try { colorUI.hue.setPointerCapture(e.pointerId); } catch (_) {} setHueFromPointer(e);
  });
  colorUI.hue.addEventListener('pointermove', (e) => { if (hueDragging) setHueFromPointer(e); });
  colorUI.hue.addEventListener('pointerup', () => { hueDragging = false; });
  colorUI.hue.addEventListener('pointercancel', () => { hueDragging = false; });
  colorUI.hue.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    colorHSV.h = (colorHSV.h + (e.key === 'ArrowRight' ? 2 : -2) + 360) % 360;
    refreshColorPicker(true);
  });
  colorUI.hex.addEventListener('input', () => {
    const rgb = hexToRgb(colorUI.hex.value);
    if (!rgb) return;
    colorHSV = rgbToHsv(rgb.r, rgb.g, rgb.b);
    refreshColorPicker(true);
  });
  colorUI.hex.addEventListener('blur', () => { refreshColorPicker(false); });
  colorUI.hex.addEventListener('keydown', (e) => { if (e.key === 'Enter') closeColorPicker(true); });
  colorUI.apply.addEventListener('click', () => closeColorPicker(true));
  colorUI.backdrop.addEventListener('click', (e) => { if (e.target === colorUI.backdrop) closeColorPicker(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !colorUI.backdrop.hidden) { e.stopPropagation(); closeColorPicker(false); } });
  if ('EyeDropper' in window) {
    colorUI.eyedropper.hidden = false;
    colorUI.eyedropper.addEventListener('click', async () => {
      try {
        const result = await new EyeDropper().open();
        const rgb = hexToRgb(result.sRGBHex);
        if (!rgb) return;
        colorHSV = rgbToHsv(rgb.r, rgb.g, rgb.b);
        refreshColorPicker(true);
      } catch (_) {}
    });
  }
  COLOR_INPUT_IDS.forEach((id) => {
    const input = $(id);
    if (!input) return;
    input.setAttribute('aria-haspopup', 'dialog');
    input.addEventListener('click', (e) => { e.preventDefault(); openColorPicker(input); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openColorPicker(input); }
    });
  });

/* ---------- init ---------- */
setMode('select');
setLang(detectLang());
setCanvasAspect('native', { scaleBoxes:false });
})();
